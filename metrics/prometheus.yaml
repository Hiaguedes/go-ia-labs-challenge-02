# Prometheus scrape configuration mounted by the root docker-compose.yaml.
# Targets are addressed by compose service name and container port.
global:
  evaluation_interval: 15s

scrape_configs:
  # The otel-collector exposes the metrics received over OTLP (8889) and its
  # own internal telemetry (8888).
  - job_name: 'otel-collector'
    scrape_interval: 10s
    static_configs:
      - targets: ['otel-collector:8889']
      - targets: ['otel-collector:8888']

  # The services do not expose /metrics yet, so these targets stay DOWN until
  # they are instrumented. Ports match WEBSERVER_CEP_PORT / WEBSERVER_WEATHER_PORT
  # in .env.example.
  - job_name: 'cep'
    scrape_interval: 10s
    metrics_path: /metrics
    static_configs:
      - targets: ['service_cep:8000']

  - job_name: 'weather'
    scrape_interval: 10s
    metrics_path: /metrics
    static_configs:
      - targets: ['service_weather:8001']
