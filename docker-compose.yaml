version: '3'
services:
  jaeger-all-in-one:
    image: jaegertracing/all-in-one:latest
    restart: always
    ports:
      - "16686:16686"
      - "14268"
      - "14250"

  zipkin:
    container_name: zipkin
    image: openzipkin/zipkin:latest
    restart: always
    ports:
      - "9411:9411"   # Zipkin UI and API

  prometheus:
    container_name: prometheus
    image: prom/prometheus:latest
    restart: always
    volumes:
      - ./metrics/prometheus.yaml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    restart: always
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./metrics/otel-collector-config.yaml:/etc/otel-collector-config.yaml
    ports:
      - "8888:8888"   # Prometheus metrics exposed by the collector
      - "8889:8889"   # Prometheus exporter metrics
      - "4317:4317"   # OTLP gRPC receiver

  grafana:
    container_name: grafana
    image: grafana/grafana:latest
    restart: always
    ports:
      - "3001:3000"
    depends_on:
      - prometheus

  service_cep:
    container_name: service_cep
    build:
      context: .
      dockerfile: Dockerfile.cep
    environment:
      - WEBSERVER_CEP_PORT=${WEBSERVER_CEP_PORT}
      - WEATHER_SERVICE_URL=http://service_weather:${WEBSERVER_WEATHER_PORT}
      - OTEL_EXPORTER_OTLP_ENDPOINT=otel-collector:4317
    ports:
      - "${WEBSERVER_CEP_PORT}:${WEBSERVER_CEP_PORT}"
    depends_on:
      - jaeger-all-in-one
      - prometheus
      - otel-collector
      - service_weather

  service_weather:
    container_name: service_weather
    build:
      context: .
      dockerfile: Dockerfile.weather
    environment:
      - WEATHER_API_KEY=${WEATHER_API_KEY}
      - WEBSERVER_WEATHER_PORT=${WEBSERVER_WEATHER_PORT}
      - OTEL_EXPORTER_OTLP_ENDPOINT=otel-collector:4317
    ports:
      - "${WEBSERVER_WEATHER_PORT}:${WEBSERVER_WEATHER_PORT}"
    depends_on:
      - jaeger-all-in-one
      - prometheus
      - otel-collector